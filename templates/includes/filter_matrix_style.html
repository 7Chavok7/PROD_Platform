<!-- Универсальный фильтр для таблиц -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-2">
            <!-- Поле поиска -->
            <div class="col-md-6">
                <input type="text" id="filterSearch" class="form-control form-control-sm" 
                       placeholder="{{ search_placeholder|default:'Поиск...' }}" 
                       value="{{ request.GET.search }}">
            </div>
            <!-- Выпадающий список -->
            <div class="col-md-6">
                <select id="filterSelect" class="form-select form-select-sm">
                    <option value="">{{ select_default|default:'Все' }}</option>
                    {% for option in filter_options %}
                        <option value="{{ option.value }}" 
                                {% if request.GET|get_item:filter_param == option.value|stringformat:'s' %}selected{% endif %}>
                            {{ option.label }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>
</div>
